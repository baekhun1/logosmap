<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성경 지명·인물 통합 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>

:root {
  --bg:#0d0c10; --surface:#16141a; --border:#2e2a38;
  --text:#e8e2d4; --muted:#7a7288; --accent:#c8a96e; --glow:rgba(200,169,110,0.15);
  --c-patriarch:#5b9bd4;  /* 창조·족장 */
  --c-exodus:#c8a84a;     /* 출애굽·광야·정복 */
  --c-judges:#7ac47a;     /* 사사 */
  --c-kingdom:#c44a6a;    /* 통일왕국 */
  --c-divided:#9b7fd4;    /* 분열왕국 */
  --c-exile:#e05c5c;      /* 포로기·귀환기 */
  --c-prophets:#4caf8a;   /* 선지자 활동 */
  --c-outside:#d4954a;    /* 이스라엘 외부 */
  /* 인물여정 */
  --sarah:#e8a0c0;--rebekah:#d88fb0;--rachel:#c87ba0;--leah:#b06a90;--caleb_person:#6a8f4a;--jonathan:#4a7ab0;--nathan_prophet:#8060a8;--absalom:#a04a4a;--josiah_person:#3a7a5a;--manasseh_king:#7a4a3a;--lazarus_bethany:#6a9a6a;--nicodemus:#5a7a9a;--herod_great:#8a6030;--caiaphas:#6a5040;--zacchaeus:#a0803a;--gamaliel:#4a6a8a;--esau:#a06840;--judah_patriarch:#9a5a30;--tamar_genesis38:#8a4a70;--balaam:#7a6a3a;--jael:#5a7a4a;--delilah:#8a4a5a;--naomi:#7a5a3a;--abner:#5a5a6a;--joab:#5a4a4a;--michal:#a06a8a;--abigail:#a0507a;--uriah:#5a5a5a;--athaliah:#7a3a3a;--shadrach_meshach_abednego:#c07030;--belshazzar:#8a4a6a;--cyrus:#4a6a5a;--hosea_prophet:#a04a7a;--amos_person:#6a7a4a;--micah_prophet:#5a6a8a;--malachi:#6a5a7a;--herod_antipas:#7a5a2a;--felix:#5a6a7a;--festus:#6a5a5a;--thomas_apostle:#4a7a7a;--matthew_apostle:#4a8a5a;--titus_companion:#5a7a6a;--herod_agrippa2:#8a6a4a;--joel_prophet:#4a6a8a;--nathanael_bartholomew:#5a8a4a;--andrew_apostle:#4a6a9a;--philip_apostle:#6a5a9a;--james_alphaeus:#7a6a5a;--thaddaeus_jude:#5a7a8a;--simon_zealot:#8a4a4a;--hagar:#c08a50;--laban:#8a7a4a;--mephibosheth:#6a8a7a;--philemon_person:#7a8a5a;--obadiah_prophet:#6a4a5a;--nahum_prophet:#5a4a4a;--habakkuk_prophet:#4a5a6a;--zephaniah_prophet:#7a4a4a;--job_person:#8a7050;--rahab_person:#a0603a;--naaman_person:#3a7a8a;--jehu_person:#6a3a3a;--mary_magdalene:#d05fa0;--james_john:#5b8def;--judas_iscariot:#7a7a7a;--pilate:#8a6d3b;--joseph_arimathea:#9c7ab0;--philip_evangelist:#40a0a0;--samaritan_woman:#c08040;--simon_magus:#a05050;--barnabas:#5ca08a;--mark:#a0784a;--ananias_dam:#7088c0;--syrophoenician:#c060a0;--john_apostle:#4488c0;--epaphras:#a08850;--aquila_priscilla:#50b0a0;--timothy:#b05fa0;--onesimus:#8050a0;--silas:#5070b0;--lydia:#e060a0;--gallio:#a0a040;--epaphroditus:#b07840;--luke:#50a070;--julius:#9a9a50;--cornelius:#c0a040;--othniel:#8D6E63;--ehud:#6D4C41;--shamgar:#795548;--barak:#5D4037;--gideon:#A1887F;--tola:#8D6E63;--jair:#6D4C41;--jephthah:#795548;--ibzan:#A1887F;--elon:#8D6E63;--abdon:#6D4C41;--samson:#5D4037;--eli:#8D6E63;--saul:#C62828;--elisha:#00897B;--daniel:#3949AB;--nebuchadnezzar:#4E342E;--zechariah_prophet:#00838F;--haggai:#0277BD;--zerubbabel:#00695C;--mordecai:#6A1B9A;--boaz:#AD1457;--hannah:#D81B60;
  --moses:#f0c040;--jesus:#60c080;--paul:#6090e0;--joshua:#c060a8;
  --dinah:#b06a90;--potiphar_wife:#8a6a4a;--zipporah_jethro:#6a8a7a;--korah:#7a4a4a;--phinehas_priest:#8a6a3a;--balak:#6a5a3a;--hophni_phinehas:#5a4a3a;--nabal:#7a6a4a;--doeg:#6a3a3a;--ahithophel:#5a5a3a;--amnon_tamar:#8a4a5a;--adonijah:#7a5a3a;--gehazi:#6a7a4a;--zedekiah:#6a3a3a;--jehoiakim:#7a4a3a;--jehoiachin:#5a4a4a;--huldah:#8a5a7a;--haman:#7a3a4a;--darius_mede:#4a6a8a;--baruch:#6a5a4a;--simon_cyrene:#7a6a5a;--cleopas:#5a8a6a;--eutychus:#4a8a9a;
  --cain:#6b4c3a;--abel:#8faa6a;--seth:#5a8a6a;--enoch_walked:#7a9ac0;--ishmael:#c08050;--asa_king:#5a7a9a;--jehoshaphat:#4a8ab0;--joash_king:#b0904a;--jehoiada:#8a6a4a;--uzziah:#a07a3a;--ahaz_king:#6a4a4a;--omri:#7a6a4a;--micaiah_prophet:#5a6a4a;--sennacherib:#7a3a3a;--herod_agrippa1:#8a5a3a;--barabbas:#5a4a4a;--annas:#6a5a4a;--herodias:#a04a70;--phoebe:#4a8a9a;--tychicus:#5a9a7a;--aristarchus:#7a8a4a;--sergius_paulus:#4a7a9a;
  --abraham:#e8824a;--isaac:#c8a030;--jacob:#7ab85e;--joseph:#4ab8c0;--david:#c050a0;--melchizedek:#b8963a;--goliath:#4a3a2a;--lot_person:#a07a4a;--zechariah_elizabeth:#7a9a6a;--ananias_sapphira:#8a3a3a;
  --samuel:#7abcdc;--solomon:#d4a830;--elijah:#4caf8a;--peter:#e87070;
  --noah:#8BC34A;--deborah:#FF9800;--ruth:#E91E63;--isaiah:#9C27B0;--hezekiah:#2196F3;
  --jeremiah:#a07850;--ezekiel:#607D8B;--esther:#FF5722;--nehemiah:#009688;--john_baptist:#03A9F4;
  --ezra:#FF6F00;--jonah:#00897B;
  --adam:#a0c878;--eve:#f4a0c0;--aaron:#d4a030;--miriam:#e070b0;
  --bathsheba:#c07890;--rehoboam:#8a6040;--jeroboam:#b06030;
  --ahab:#7a4050;--jezebel:#d03060;
  --stephen:#e07040;--apollos:#4070c0;--james_brother:#7a9040;
  --mary_mother:#c0a0e0;--joseph_earthly:#9080a0;
  /* 신약 */
  --c-galilee:   #4a9edd;
  --c-judea:     #e05c5c;
  --c-samaria:   #d4954a;
  --c-syria:     #9b7fd4;
  --c-asia:      #4caf8a;
  --c-macedonia: #e0a030;
  --c-rome:      #c44a6a;
  --ui-zoom: 1;

*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;}

header{position:fixed;top:0;left:0;right:0;z-index:1100;
  background:rgba(13,12,16,0.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:6px 16px;display:flex;flex-direction:column;gap:5px;}
.header-row1{display:flex;align-items:center;gap:12px;}
.header-row2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-bottom:2px;}
.logo{font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;color:var(--accent);white-space:nowrap;}
.title-ko{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:#f0ead8;white-space:nowrap;}
.subtitle{font-size:10px;color:var(--muted);margin-top:1px;}
.header-right{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap;}
.search-box{background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:5px 11px;color:var(--text);font-family:inherit;font-size:12px;
  width:160px;outline:none;transition:border-color .2s;}
.search-box:focus{border-color:var(--accent);}
.search-box::placeholder{color:var(--muted);}
.filter-btn{padding:4px 9px;border-radius:5px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);font-size:11px;cursor:pointer;
  font-family:inherit;transition:all .15s;white-space:nowrap;}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:var(--glow);}

.sidebar{position:fixed;left:0;top:var(--header-h,80px);bottom:0;width:270px;z-index:1000;
  background:rgba(22,20,26,0.97);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;}
.legend{padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0;max-height:45%;overflow-y:auto;}
.legend-title{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.legend-item{display:flex;align-items:center;gap:7px;cursor:pointer;
  padding:3px 5px;border-radius:4px;transition:background .15s;margin-bottom:2px;}
.legend-item:hover{background:rgba(255,255,255,.05);}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.legend-label{font-size:11px;}
.legend-count{margin-left:auto;font-size:10px;color:var(--muted);
  background:rgba(255,255,255,.06);padding:1px 5px;border-radius:3px;}
.place-list{flex:1;overflow-y:auto;padding:6px;}
.place-list::-webkit-scrollbar{width:3px;}
.place-list::-webkit-scrollbar-thumb{background:var(--border);}
.place-item{padding:7px 9px;border-radius:5px;cursor:pointer;margin-bottom:2px;
  transition:background .12s;display:flex;align-items:flex-start;gap:7px;
  border:1px solid transparent;}
.place-item:hover{background:rgba(255,255,255,.06);}
.place-item.selected{background:var(--glow);border-color:var(--accent);}
.pi-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.pi-name{font-size:12px;font-weight:500;color:#f0ead8;}
.pi-region{font-size:10px;color:var(--muted);margin-top:1px;}

#map{position:fixed;left:270px;top:var(--header-h,80px);right:0;bottom:0;z-index:500;}
.leaflet-container{background:#0e1825!important;font-family:'Noto Sans KR',sans-serif;}
.leaflet-popup-content{margin:0!important;padding:0!important;
  max-height:80vh!important;overflow-y:auto!important;overflow-x:hidden!important;
  overscroll-behavior:contain;}
/* 팝업 내부 스크롤바 테마 맞춤 */
.leaflet-popup-content::-webkit-scrollbar{width:8px;}
.leaflet-popup-content::-webkit-scrollbar-track{background:transparent;}
.leaflet-popup-content::-webkit-scrollbar-thumb{background:rgba(200,169,110,0.35);
  border-radius:4px;border:2px solid transparent;background-clip:padding-box;}
.leaflet-popup-content::-webkit-scrollbar-thumb:hover{background:rgba(200,169,110,0.6);
  background-clip:padding-box;}
.leaflet-popup-content{scrollbar-width:thin;scrollbar-color:rgba(200,169,110,0.4) transparent;}
.leaflet-popup-content-wrapper{background:rgba(22,20,26,0.97)!important;color:var(--text)!important;
  border:1px solid var(--border)!important;border-radius:10px!important;
  box-shadow:0 8px 40px rgba(0,0,0,.7)!important;max-width:min(94vw, calc(400px * var(--ui-zoom)))!important;
  touch-action:auto!important;}
.leaflet-popup, .leaflet-popup-content{touch-action:auto!important;}
.leaflet-popup-tip{background:rgba(22,20,26,0.97)!important;}
.leaflet-popup-close-button{color:var(--muted)!important;font-size:16px!important;top:10px!important;right:12px!important;}
.leaflet-control-zoom a{background:rgba(22,20,26,0.95)!important;color:var(--text)!important;
  border-color:var(--border)!important;font-size:16px!important;}
.leaflet-control-zoom a:hover{background:var(--glow)!important;color:var(--accent)!important;}
.leaflet-tile{filter:none;}
body.tile-dark .leaflet-tile{filter:brightness(0.72) saturate(0.65) hue-rotate(200deg);}

.popup-wrap{padding:10px 8px;}
.popup-badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:calc(10px * var(--ui-zoom));
  font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.popup-name{font-family:'Noto Serif KR',serif;font-size:calc(19px * var(--ui-zoom));font-weight:700;color:#f5eed8;margin-bottom:2px;}
.popup-name-en{font-family:'Cinzel',serif;font-size:calc(10px * var(--ui-zoom));color:var(--accent);letter-spacing:2px;margin-bottom:6px;}
.popup-geo{font-size:calc(11px * var(--ui-zoom));color:#a0b4c8;margin-bottom:10px;line-height:1.6;}
.popup-sec-title{font-size:calc(9px * var(--ui-zoom));letter-spacing:2px;text-transform:uppercase;color:var(--accent);
  margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid rgba(200,169,110,0.2);}
.popup-event{margin-bottom:7px;}
.popup-time{display:block;font-size:calc(10px * var(--ui-zoom));color:var(--accent);margin-bottom:2px;}
.popup-ev-body{width:100%;}
.popup-person{font-size:calc(12px * var(--ui-zoom));font-weight:600;color:#c8e0f4;margin-bottom:1px;}
.popup-desc{font-size:calc(11px * var(--ui-zoom));color:#aaa8b0;line-height:1.5;}
.popup-ref{font-size:calc(10px * var(--ui-zoom));color:var(--accent);opacity:.7;margin-top:1px;}

.stats{position:fixed;right:16px;bottom:20px;z-index:1000;display:flex;flex-direction:column;gap:4px;}
.stat-chip{background:rgba(22,20,26,0.88);border:1px solid var(--border);
  border-radius:5px;padding:3px 10px;font-size:10px;color:var(--muted);backdrop-filter:blur(4px);}
.stat-chip span{color:var(--accent);font-weight:600;}
.tile-toggle{position:fixed;right:16px;top:calc(var(--header-h,80px) + 10px);z-index:1200;display:flex;flex-direction:column;gap:4px;}
.tile-btn{padding:5px 12px;border-radius:5px;border:1px solid var(--border);
  background:rgba(22,20,26,0.97);color:#e8e2d4;font-size:11px;cursor:pointer;
  font-family:inherit;transition:all .15s;backdrop-filter:blur(6px);
  text-shadow:0 1px 3px rgba(0,0,0,0.9);font-weight:500;}
.tile-btn.active,.tile-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(22,20,26,1);}


.map-tabs{display:flex;gap:4px;background:rgba(22,20,26,.6);padding:3px;border-radius:8px;border:1px solid var(--border);flex-wrap:wrap;max-height:92px;overflow-y:auto;align-content:flex-start;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.map-tabs::-webkit-scrollbar{width:7px}
.map-tabs::-webkit-scrollbar-track{background:transparent}
.map-tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.map-tabs::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.map-tab{padding:4px 10px;border-radius:6px;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:500;transition:all .18s;color:var(--muted);background:transparent;white-space:nowrap}
.map-tab:hover{background:rgba(255,255,255,.07)}
.map-tab.active{font-weight:700}
.map-tab[data-map="all"].active{background:rgba(255,255,255,.15);color:#fff}
.map-tab[data-map="moses"].active{background:var(--moses);color:#111}
.map-tab[data-map="jesus"].active{background:var(--jesus);color:#111}
.map-tab[data-map="paul"].active{background:var(--paul);color:#fff}
.map-tab[data-map="joshua"].active{background:var(--joshua);color:#fff}
.map-tab[data-map="abraham"].active{background:var(--abraham);color:#fff}
.map-tab[data-map="melchizedek"].active{background:var(--melchizedek);color:#fff}
.map-tab[data-map="goliath"].active{background:var(--goliath);color:#fff}
.map-tab[data-map="lot_person"].active{background:var(--lot_person);color:#fff}
.map-tab[data-map="zechariah_elizabeth"].active{background:var(--zechariah_elizabeth);color:#fff}
.map-tab[data-map="ananias_sapphira"].active{background:var(--ananias_sapphira);color:#fff}
.map-tab[data-map="isaac"].active{background:var(--isaac);color:#111}
.map-tab[data-map="jacob"].active{background:var(--jacob);color:#111}
.map-tab[data-map="joseph"].active{background:var(--joseph);color:#111}
.map-tab[data-map="david"].active{background:var(--david);color:#fff}
.map-tab[data-map="samuel"].active{background:var(--samuel);color:#111}
.map-tab[data-map="solomon"].active{background:var(--solomon);color:#111}
.map-tab[data-map="elijah"].active{background:var(--elijah);color:#111}
.map-tab[data-map="peter"].active{background:var(--peter);color:#fff}
.map-tab[data-map="noah"].active{background:var(--noah);color:#111}
.map-tab[data-map="deborah"].active{background:var(--deborah);color:#111}
.map-tab[data-map="ruth"].active{background:var(--ruth);color:#fff}
.map-tab[data-map="isaiah"].active{background:var(--isaiah);color:#fff}
.map-tab[data-map="hezekiah"].active{background:var(--hezekiah);color:#fff}
.map-tab[data-map="jeremiah"].active{background:var(--jeremiah);color:#fff}
.map-tab[data-map="ezekiel"].active{background:var(--ezekiel);color:#fff}
.map-tab[data-map="esther"].active{background:var(--esther);color:#fff}
.map-tab[data-map="nehemiah"].active{background:var(--nehemiah);color:#fff}
.map-tab[data-map="john_baptist"].active{background:var(--john_baptist);color:#111}
.map-tab[data-map="ezra"].active{background:var(--ezra);color:#fff}
.map-tab[data-map="jonah"].active{background:var(--jonah);color:#fff}

</style>
</head>
<body>

<header>
  <div class="header-row1">
    <div>
      <div class="logo">Bible Atlas</div>
      <div class="title-ko">성경 지명·인물 통합 지도</div>
    </div>
    <div id="textZoomCtrl" style="margin-left:auto;display:flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:2px;">
      <button onclick="setTextZoom(-1)" title="팝업 글자·크기 작게" style="width:24px;height:24px;border:none;border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;">가−</button>
      <span id="textZoomLabel" onclick="setTextZoom(0)" title="기본 크기로" style="width:38px;text-align:center;font-size:10px;color:var(--muted);cursor:pointer;user-select:none;">100%</span>
      <button onclick="setTextZoom(1)" title="팝업 글자·크기 크게" style="width:24px;height:24px;border:none;border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;">가+</button>
    </div>
    <input type="text" class="search-box" id="searchBox" placeholder="지명·인물 검색..." oninput="onSearch(this.value)" style="width:200px">
  </div>
  <div class="header-row2">
    <div class="map-tabs">
      <button class="map-tab active" data-map="all"      onclick="switchMap('all',this)">🌐 전체</button>
      <button class="map-tab" data-map="adam"    onclick="switchMap('adam',this)"    style="color:var(--adam)">🌿 아담</button>
      <button class="map-tab" data-map="eve"     onclick="switchMap('eve',this)"     style="color:var(--eve)">🍎 하와</button>
      <button class="map-tab" data-map="cain" onclick="switchMap('cain',this)" style="color:var(--cain)">🗡 가인</button>
      <button class="map-tab" data-map="abel" onclick="switchMap('abel',this)" style="color:var(--abel)">🐑 아벨</button>
      <button class="map-tab" data-map="seth" onclick="switchMap('seth',this)" style="color:var(--seth)">🌱 셋</button>
      <button class="map-tab" data-map="enoch_walked" onclick="switchMap('enoch_walked',this)" style="color:var(--enoch_walked)">🕊 에녹(야렛의 아들)</button>
      <button class="map-tab" data-map="noah"    onclick="switchMap('noah',this)"    style="color:var(--noah)">🌊 노아</button>
      <button class="map-tab" data-map="abraham" onclick="switchMap('abraham',this)" style="color:var(--abraham)">🏕 아브라함</button>

const XREF_BY_PLACE = {};
EVENT_XREFS.forEach(x => {
  [[x.a,x.b],[x.b,x.a]].forEach(([self,other]) => {
    if(!XREF_BY_PLACE[self.placeId]) XREF_BY_PLACE[self.placeId] = [];
    XREF_BY_PLACE[self.placeId].push({ refMatch:self.refMatch, otherPlaceId:other.placeId, type:x.type, label:x.label, note:x.note });
  });
});
function findEventXrefs(placeId, ref) {
  const list = XREF_BY_PLACE[placeId];
  if(!list) return [];
  const matched = list.filter(x => (ref||'').includes(x.refMatch));
  // 같은 개념적 연결이 서로 다른 인물여정 경로(예: 모리아산 지명 / 이삭 인물여정)를 통해
  // 중복 등록된 경우, 라벨 기준으로 한 번만 보여준다.
  const seen = {};
  return matched.filter(x => {
    if (seen[x.label]) return false;
    seen[x.label] = true;
    return true;
  });
}

function makeIcon(color,selected=false,virtual=false){
  const r=selected?11:8;
  if (virtual) {
    // 가상 지명: 실제 지리적 위치가 아닌 서신서 등의 신학적 논증을 표시 — 점선 다이아몬드로 구분
    const s = selected ? 10 : 7.5;
    const glow = selected?`<circle cx="12" cy="12" r="${s+6}" fill="none" stroke="${color}" stroke-width="1.2" opacity="0.35"/>`:'';
    const diamond=`<rect x="${12-s*0.7}" y="${12-s*0.7}" width="${s*1.4}" height="${s*1.4}" fill="${color}" fill-opacity="0.22" stroke="${color}" stroke-width="${selected?1.6:1.2}" stroke-dasharray="3,2" transform="rotate(45 12 12)"/>`;
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24">${glow}${diamond}</svg>`;
    return L.divIcon({className:'',html:`<div style="position:relative;width:24px;height:24px">${svg}</div>`,
      iconSize:[24,24],iconAnchor:[12,12],popupAnchor:[0,-14]});
  }
  const glow=selected?`<circle cx="12" cy="12" r="${r+5}" fill="none" stroke="${color}" stroke-width="1.2" opacity="0.4"/>` :'';
  const ring=`<circle cx="12" cy="12" r="${r+2}" fill="none" stroke="${color}" stroke-width="${selected?1.2:0.8}" opacity="${selected?0.6:0.35}"/>`;
  const dot=`<circle cx="12" cy="12" r="${r}" fill="${color}" stroke="${selected?'#fff':color}" stroke-width="${selected?2:1}" opacity="${selected?1:0.9}"/>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24">${glow}${ring}${dot}</svg>`;
  return L.divIcon({className:'',html:`<div style="position:relative;width:24px;height:24px">${svg}</div>`,
    iconSize:[24,24],iconAnchor:[12,12],popupAnchor:[0,-14]});
}

function bibleLinksHTML(ref) {
  if (!ref) return '';
  const m = ref.match(/^([가-힣]+)\s*(\d+)(?:\s*[:장]\s*(\d+))?/);
  if (!m) return '';
  const book = KOREAN_BOOKS[m[1]];
  if (!book) return '';
  const chap = m[2], verse = m[3] || '1';
  const bibleUrl = `https://www.bible.com/ko/bible/88/${book.code}.${chap}.${verse}.KRV`;
  const origUrl = `https://biblehub.com/interlinear/${book.blb}/${chap}-${verse}.htm`;
  return '<div style="display:flex;gap:5px;margin-top:4px">'
    + `<a href="${bibleUrl}" target="_blank" rel="noopener" style="flex:1;text-align:center;font-size:calc(9px * var(--ui-zoom));padding:3px 6px;border-radius:5px;border:1px solid #4a9edd55;background:#4a9edd14;color:#4a9edd;text-decoration:none;font-family:inherit;white-space:nowrap">📖 본문 보기</a>`

}

// ── 연대 문자열에서 정렬 가능한 연도 추출 (BC는 음수, AD는 양수) ──
function parseYear(t) {
  if (!t) return null;
  const bc = t.match(/BC\s*(\d+)/);
  if (bc) return -parseInt(bc[1], 10);
  const ad = t.match(/AD\s*(\d+)/);
  if (ad) return parseInt(ad[1], 10);
  return null;
}

// ── 지명에서 시대별 수식어(괄호·병기)를 뗀 "기본 지명" 추출 ──
function baseNameOf(n) {
  return (n||'').replace(/\s*[(（][^)）]*[)）]/g, '').trim().split('·')[0].trim();
}
// ── 두 좌표 사이 거리(km, 하버사인) ──
function distKm(lat1, lng1, lat2, lng2) {
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
// ── 같은 시대(region)+같은 좌표(동일 지명)를 하나로 합쳐 사건을 연대순 정렬 ──
// 검색 중일 때는 시대(region) 구분 없이, "기본 지명"이 같고 인접(12km 이내)한 항목을
// 좌표가 정확히 일치하지 않아도 하나로 통합한다 (예: "예루살렘"과 "예루살렘 (요시야 개혁)").
// 반대로 기본 지명이 다르면 좌표가 우연히 같아도(반올림 충돌) 별개로 유지한다.
function getMergedPlaces(list) {
  if (!searchQuery) {
    const groups = {};
    const order = [];
    list.forEach(p => {
      const key = p.region + '|' + p.lat + ',' + p.lng;
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(p);
    });
    return order.map(key => mergeItems(groups[key]));
  }
  const clusters = []; // { base, lat, lng, items }
  list.forEach(p => {
    const base = baseNameOf(p.name);
    let cluster = null;
    if (base) {
      cluster = clusters.find(c =>
        c.base && (c.base === base || c.base.startsWith(base) || base.startsWith(c.base)) &&
        distKm(c.lat, c.lng, p.lat, p.lng) <= 12
      );
    }
    if (!cluster) { cluster = { base, lat: p.lat, lng: p.lng, items: [] }; clusters.push(cluster); }
    cluster.items.push(p);
  });
  return clusters.map(c => mergeItems(c.items));
}

function eventYearCompare(a, b) {
  const ya = parseYear(a.time), yb = parseYear(b.time);
  if (ya !== null && yb !== null) return ya - yb;
  if (ya !== null) return -1;
  if (yb !== null) return 1;
  return 0;
}

function mergeItems(items) {
    if (items.length === 1) {
      const it = items[0];
      // 단일 지명도 사건을 연대순 정렬 (원본 훼손 없이 복사본 반환)
      return Object.assign({}, it, { events: (it.events||[]).slice().sort(eventYearCompare) });
    }
    const events = [];
    items.forEach(it => it.events.forEach(e => events.push(Object.assign({}, e, {__src: e.__src || it.name}))));
    events.sort(eventYearCompare);
    // 괄호 수식어·병기 지명 제거 후 공통 기본 지명 추출 (예: "예루살렘·랍바 (우리아)" → "예루살렘")
    const stripKo = n => (n||'').replace(/\s*[(（][^)）]*[)）]/g, '').trim().split('·')[0].trim();
    const baseNames = items.map(i => stripKo(i.name)).filter(Boolean);
    const shortKo = baseNames.length ? baseNames.reduce((a,b)=>b.length<a.length?b:a) : '';
    const sameBase = shortKo && baseNames.every(b => b === shortKo || b.startsWith(shortKo));
    const stripEn = n => (n||'').split('—')[0].replace(/\s*[(（][^)）]*[)）]/g, '').trim();
    const baseEnArr = items.map(i => stripEn(i.nameEn)).filter(Boolean);
    const shortEn = baseEnArr.length ? baseEnArr.reduce((a,b)=>b.length<a.length?b:a) : '';
    const sameBaseEn = shortEn && baseEnArr.every(b => b === shortEn || b.startsWith(shortEn));
    const uniqRegions = [...new Set(items.flatMap(i => i._regions || [i.region]))];
    const uniqTest = [...new Set(items.flatMap(i => i._testaments || [i.testament]))];
    const allIds = [];
    items.forEach(i => { if (i._mergedIds) allIds.push(...i._mergedIds); else allIds.push(i.id); });
    return {
      id: allIds.join('__'),
      _merged: true,
      _mergedIds: allIds,
      _regionLabel: uniqRegions.length > 1 ? uniqRegions.map(r => (REGIONS[r]||{}).label||r).join(' → ') : null,
      _eraLabel: uniqTest.length > 1 ? '구약·신약' : null,
      _regions: uniqRegions,
      _testaments: uniqTest,
      name: sameBase ? shortKo : items.map(i => i.name).join(' · '),
      nameEn: sameBaseEn ? shortEn : items.map(i => i.nameEn).filter(Boolean).join(' · '),
      testament: items[0].testament,
      region: items[0].region,
      lat: items[0].lat, lng: items[0].lng,
      geo: items[0].geo,
      events
    };
}

// ── 메인 지도 검색 풀: 검색 중에는 인물 여정(JOURNEY_PLACES) 데이터도 포함 ──
function adaptJourneyForSearch(p) {
  // testament가 없는 여정 항목은 우선 인물(map 키)로 구약/신약을 판정한다.
  // 예수·세례요한 등 신약 인물의 탄생 사건은 연대가 "BC 6~4년"처럼 BC로 표기되므로,
  // 연대 부호만으로 판정하면 구약으로 잘못 분류되는 문제가 있었음 — 인물 기준을 우선한다.
  let t;
  if (p.map && NT_PERSON_MAPS.has(p.map)) {
    t = 'nt';
  } else {
    t = 'ot';
    for (const e of (p.events||[])) {
      const y = parseYear(e.time);
      if (y !== null) { t = y < 0 ? 'ot' : 'nt'; break; }
    }
  }
  return Object.assign({}, p, { testament: p.testament || t });
}
function getMainSearchPool() {
  if (!searchQuery || isJourneyMode()) return PLACES;
  const q = searchQuery.toLowerCase();
  const seen = {};
  const extra = JOURNEY_PLACES.filter(p => {
    const hit = p.name.toLowerCase().includes(q) || (p.nameEn||'').toLowerCase().includes(q) ||
                (p.events||[]).some(e=>(e.persons||'').toLowerCase().includes(q));
    if (!hit || seen[p.id]) return false;
    seen[p.id] = true;
    return true;
  }).map(adaptJourneyForSearch);
  return PLACES.concat(extra);
}

function isVisible(p) {
  if (isJourneyMode()) {
    if (p.map !== currentMap) return false;
    if (currentJourneyFilter !== 'all' && p.region !== currentJourneyFilter) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      return p.name.toLowerCase().includes(q) || (p.nameEn||'').toLowerCase().includes(q) ||
             (p.events||[]).some(e=>(e.persons||'').toLowerCase().includes(q));
    }
    return true;
  }
  if (currentFilter === 'ot' && (REGIONS[p.region]?.testament || p.testament) !== 'ot') return false;
  if (currentFilter === 'nt' && (REGIONS[p.region]?.testament || p.testament) !== 'nt') return false;
  if (currentFilter !== 'all' && currentFilter !== 'ot' && currentFilter !== 'nt' && p.region !== currentFilter) return false;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    return p.name.toLowerCase().includes(q) || (p.nameEn||'').toLowerCase().includes(q) ||
           p.events.some(e=>(e.persons||'').toLowerCase().includes(q));
  }
  return true;
}

    btnAll.style.color      = isAllActive ? '#8ac97a' : 'var(--muted)';
    btnAll.style.borderColor= isAllActive ? '#8ac97a' : 'var(--border)';
    btnAll.style.fontWeight = isAllActive ? '700' : '600';
    btnAll.style.background = isAllActive ? 'rgba(138,201,122,0.14)' : 'rgba(255,255,255,0.06)';
  }
  if (btnOt) {
    btnOt.style.color      = currentFilter==='ot' ? '#c8a84a' : 'var(--muted)';
    btnOt.style.borderColor= currentFilter==='ot' ? '#c8a84a' : 'var(--border)';
    btnOt.style.fontWeight = currentFilter==='ot' ? '700'      : '400';
    btnOt.style.background = currentFilter==='ot' ? 'rgba(200,168,74,0.12)' : 'rgba(255,255,255,0.06)';
  }
  if (btnNt) {
    btnNt.style.color      = currentFilter==='nt' ? '#4a9edd' : 'var(--muted)';
    btnNt.style.borderColor= currentFilter==='nt' ? '#4a9edd' : 'var(--border)';
    btnNt.style.fontWeight = currentFilter==='nt' ? '700'      : '400';
    btnNt.style.background = currentFilter==='nt' ? 'rgba(74,158,221,0.12)' : 'rgba(255,255,255,0.06)';
  }
}

function renderList() {
  const el=document.getElementById('placeList'); if(!el) return;
  if (xrefViewMode) {
    const v=document.getElementById('vcnt'); if(v) v.textContent=ALL_XREFS.length;
    let html = `<div style="font-size:9px;letter-spacing:1.5px;color:#c8a84a;padding:6px 8px 2px;text-transform:uppercase;opacity:.85">🔗 구약·신약 연결 (${ALL_XREFS.length})</div>`;
    html += ALL_XREFS.map(x => {
      const aPlace = PLACES.find(p=>p.id===x.a.placeId) || JOURNEY_PLACES.find(p=>p.id===x.a.placeId);
      const bPlace = PLACES.find(p=>p.id===x.b.placeId) || JOURNEY_PLACES.find(p=>p.id===x.b.placeId);
      return `<div style="margin:0 8px 8px;padding:8px 10px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:7px">
        <div style="font-size:9px;font-weight:700;color:#c8a84a;letter-spacing:.5px;margin-bottom:3px">${x.type}</div>
        <div style="font-size:12px;font-weight:600;line-height:1.4;margin-bottom:5px">${x.label}</div>
        <div style="font-size:10px;color:var(--muted);line-height:1.5;margin-bottom:7px">${x.note.length>90?x.note.slice(0,90)+'…':x.note}</div>
        <div style="display:flex;gap:5px">
          <button onclick="selectPlace('${x.a.placeId}')" style="flex:1;font-size:10px;padding:4px 6px;border-radius:5px;border:1px solid #4a9edd55;background:#4a9edd14;color:#4a9edd;cursor:pointer;font-family:inherit">📜 ${aPlace?aPlace.name:'구약'} 보기</button>
          <button onclick="selectPlace('${x.b.placeId}')" style="flex:1;font-size:10px;padding:4px 6px;border-radius:5px;border:1px solid #c8a84a55;background:#c8a84a14;color:#c8a84a;cursor:pointer;font-family:inherit">✝ ${bPlace?bPlace.name:'신약'} 보기</button>
        </div>
      </div>`;
    }).join('');
    el.innerHTML = html;
    return;
  }
  if (isJourneyMode()) {
    const vis=JOURNEY_PLACES.filter(isVisible);
    if(!vis.length){el.innerHTML='<div style="padding:16px;text-align:center;color:var(--muted);font-size:12px">검색 결과 없음</div>';return;}
    const byR={};
    vis.forEach(q=>{if(!byR[q.region])byR[q.region]=[];byR[q.region].push(q);});
    let html='';
    Object.entries(byR).forEach(([rk,ps])=>{
      const col=REGION_COLORS[rk]||MAP_COLORS[currentMap]||'#888', lbl=REGION_LABELS[rk]||rk;
      html+=`<div style="font-size:9px;letter-spacing:1.5px;color:${col};padding:6px 8px 2px;text-transform:uppercase;opacity:.85">${lbl}</div>`;
      html+=ps.map(q=>`<div class="place-item${q.id===selectedId?' selected':''}" onclick="selectPlace('${q.id}')"><div class="pi-dot" style="${q.virtual?`background:transparent;border:1.5px dashed ${col};transform:rotate(45deg);border-radius:2px`:`background:${col}`}"></div><div><div class="pi-name">${q.name}${q.virtual?' <span style="font-size:9px;color:#c8a84a;font-weight:400">◆주제</span>':''}</div><div class="pi-region">${q.nameEn||''}</div></div></div>`).join('');
    });
    el.innerHTML=html;
    const v=document.getElementById('vcnt'); if(v) v.textContent=vis.length; return;
  }
  const vis=getMergedPlaces(getMainSearchPool().filter(isVisible)),
        ot=vis.filter(q=>(q._testaments||[q.testament]).includes('ot')),
        nt=vis.filter(q=>(q._testaments||[q.testament]).includes('nt'));
  let html='';
  if(ot.length){
    html+=`<div style="font-size:9px;letter-spacing:2px;color:var(--muted);padding:6px 8px 2px;text-transform:uppercase">📅 구약 (${ot.length})</div>`;
    html+=ot.map(q=>{const col=(REGIONS[q.region]||{}).color||'#8a8a8a';const sel=q._merged?(q.id===selectedId||q._mergedIds.includes(selectedId)):q.id===selectedId;const navId=q._merged?q._mergedIds[0]:q.id;return `<div class="place-item${sel?' selected':''}" onclick="selectPlace('${navId}')"><div class="pi-dot" style="${q.virtual?`background:transparent;border:1.5px dashed ${col};transform:rotate(45deg);border-radius:2px`:`background:${col}`}"></div><div><div class="pi-name">${q.name}${q.virtual?' <span style="font-size:9px;color:#c8a84a;font-weight:400">◆주제</span>':''}</div><div class="pi-region">${q._regionLabel||(REGIONS[q.region]||{}).label||q.nameEn||''}</div></div></div>`;}).join('');
  }
  if(nt.length){
    html+=`<div style="font-size:9px;letter-spacing:2px;color:var(--muted);padding:6px 8px 2px;text-transform:uppercase">🗺 신약 (${nt.length})</div>`;
    html+=nt.map(q=>{const col=(REGIONS[q.region]||{}).color||'#8a8a8a';const sel=q._merged?(q.id===selectedId||q._mergedIds.includes(selectedId)):q.id===selectedId;const navId=q._merged?q._mergedIds[0]:q.id;return `<div class="place-item${sel?' selected':''}" onclick="selectPlace('${navId}')"><div class="pi-dot" style="${q.virtual?`background:transparent;border:1.5px dashed ${col};transform:rotate(45deg);border-radius:2px`:`background:${col}`}"></div><div><div class="pi-name">${q.name}${q.virtual?' <span style="font-size:9px;color:#c8a84a;font-weight:400">◆주제</span>':''}</div><div class="pi-region">${q._regionLabel||(REGIONS[q.region]||{}).label||q.nameEn||''}</div></div></div>`;}).join('');
  }
  el.innerHTML=html;
  const v=document.getElementById('vcnt'),t=document.getElementById('tcnt');
  if(v)v.textContent=vis.length; if(t)t.textContent=PLACES.length;
}

function renderMarkers() {
  Object.values(markers).forEach(m=>map.removeLayer(m)); markers={};
  const hasSel=!!selectedId;

  if (isJourneyMode()) {
    const src=JOURNEY_PLACES;
    const vis=src.filter(isVisible);
    vis.forEach(place=>{
      const col=REGION_COLORS[place.region]||MAP_COLORS[place.map]||'#888';
      const sel=place.id===selectedId;
      const marker=L.marker([place.lat,place.lng],{icon:makeIcon(col,sel,!!place.virtual),opacity:hasSel&&!sel?.3:1,zIndexOffset:sel?1000:0});
      marker.bindTooltip(place.name,{permanent:true,direction:'top',offset:[0,sel?-14:-10],className:'',pane:'tooltipPane'});
      marker.on('add',()=>{const tt=marker.getTooltip();if(tt&&tt.getElement()){tt.getElement().style.cssText=`background:${sel?col+'33':'rgba(13,12,16,0.85)'};border:1px solid ${sel?col:'#2e2a38'};border-radius:4px;padding:2px 7px;color:${sel?col:'#c8c2b6'};font-size:${sel?'11px':'9px'};font-weight:${sel?700:400};font-family:"Noto Sans KR",sans-serif;box-shadow:none;white-space:nowrap;opacity:${hasSel&&!sel?0.45:1};`;}});
      marker.bindPopup(buildPopupAll(place),{maxWidth:640,minWidth:320,autoPan:true,autoPanPadding:[20,20],keepInView:false,closeButton:true});
      marker.on('click',()=>selectPlace(place.id));
      marker.on('popupclose',()=>{if(selectedId===place.id && !_switching){selectedId=null;renderAll();}});
      marker.addTo(map); markers[place.id]=marker;
    });
  } else {
    const visRaw=getMainSearchPool().filter(isVisible);
    const merged=getMergedPlaces(visRaw);
    merged.forEach(place=>{
      const col=(REGIONS[place.region]||{}).color||'#8a8a8a';
      const sel=place._merged ? (place.id===selectedId || place._mergedIds.includes(selectedId)) : place.id===selectedId;
      const marker=L.marker([place.lat,place.lng],{icon:makeIcon(col,sel,!!place.virtual),opacity:hasSel&&!sel?.3:1,zIndexOffset:sel?1000:0});
      marker.bindTooltip(place.name,{permanent:true,direction:'top',offset:[0,sel?-14:-10],className:'',pane:'tooltipPane'});
      marker.on('add',()=>{const tt=marker.getTooltip();if(tt&&tt.getElement()){tt.getElement().style.cssText=`background:${sel?col+'33':'rgba(13,12,16,0.85)'};border:1px solid ${sel?col:'#2e2a38'};border-radius:4px;padding:2px 7px;color:${sel?col:'#c8c2b6'};font-size:${sel?'11px':'9px'};font-weight:${sel?700:400};font-family:"Noto Sans KR",sans-serif;box-shadow:none;white-space:nowrap;opacity:${hasSel&&!sel?0.45:1};`;}});
      marker.bindPopup(buildPopupAll(place),{maxWidth:640,minWidth:320,autoPan:true,autoPanPadding:[20,20],keepInView:false,closeButton:true});
      marker.on('click',()=>selectPlace(place.id));
      marker.on('popupclose',()=>{
        const stillSel = place._merged ? (place.id===selectedId || place._mergedIds.includes(selectedId)) : selectedId===place.id;
        if(stillSel && !_switching){selectedId=null;renderAll();}
      });
      marker.addTo(map); markers[place.id]=marker;
      if (place._merged) place._mergedIds.forEach(id=>{ markers[id]=marker; });
    });
  }
  const totalVisible = isJourneyMode() ? JOURNEY_PLACES.filter(isVisible).length : getMergedPlaces(getMainSearchPool().filter(isVisible)).length;
  const v=document.getElementById('vcnt'),vi=document.getElementById('visibleCount');
  if(v)v.textContent=totalVisible; if(vi)vi.textContent=totalVisible;
}

function buildPopupAll(p) {
  if (isJourneyMode()) {
    const col  = REGION_COLORS[p.region] || MAP_COLORS[p.map] || '#888';
    const rlbl = REGION_LABELS[p.region] || p.region;
    const mlbl = MAP_LABELS[p.map] || p.map;
    const mcol = MAP_COLORS[p.map] || '#888';
    // geo를 파이프로 분리
    const geoParts = (p.geo||'').split('|');
    const geoLoc  = geoParts[0].trim();
    const geoElev = geoParts.length > 1 ? geoParts[1].trim() : '';
    const elevHtml = geoElev
      ? '<div style="display:inline-flex;align-items:center;gap:5px;'
        +'margin-top:5px;padding:3px 9px;background:rgba(96,208,240,0.12);'
        +'border:1px solid rgba(96,208,240,0.3);border-radius:4px;">'
        +'<span style="font-size:calc(10px * var(--ui-zoom));color:#60d0f0">🏔</span>'
        +'<span style="font-size:calc(11px * var(--ui-zoom));color:#60d0f0;font-weight:700">'
        +geoElev.replace(/^고도[：:]\s*/,'')+'</span>'
        +'</div>'
      : '';
    const evHTML = (p.events||[]).map(function(e){
      const xrefs = findEventXrefs(p.id, e.ref);
      const xrefHTML = xrefs.map(function(xref){
        const otherPlace = PLACES.find(pl=>pl.id===xref.otherPlaceId) || JOURNEY_PLACES.find(pl=>pl.id===xref.otherPlaceId);
        const dirCol = (p.testament||'ot')==='ot' ? '#4a9edd' : '#c8a84a';
        const dirIcon = (p.testament||'ot')==='ot' ? '✝' : '📜';
        return '<div style="margin-top:6px;padding:6px 9px;cursor:pointer;'
          +'background:'+dirCol+'14;border:1px solid '+dirCol+'55;border-radius:5px;border-left:3px solid '+dirCol+'" '
          +'onclick="selectPlace(\''+xref.otherPlaceId+'\')">'
          +'<div style="font-size:calc(9px * var(--ui-zoom));font-weight:700;color:'+dirCol+';letter-spacing:.5px">'+dirIcon+' '+xref.type+' · '+xref.label+'</div>'
          +'<div style="font-size:calc(10px * var(--ui-zoom));color:#b8b0a0;line-height:1.5;margin-top:2px">'+xref.note+'</div>'
          +(otherPlace?'<div style="font-size:calc(10px * var(--ui-zoom));color:'+dirCol+';text-decoration:underline dotted;margin-top:3px;font-weight:600">→ '+otherPlace.name+' 바로가기</div>':'')
          +'</div>';
      }).join('');
      return '<div style="margin-bottom:6px;padding:6px 8px;background:rgba(255,255,255,.04);border-radius:5px;border-left:2px solid '+col+'">'
        +'<div style="font-size:calc(9px * var(--ui-zoom));color:var(--muted)">'+( e.time||'')+'</div>'
        +'<div style="font-size:calc(10px * var(--ui-zoom));font-weight:700;color:var(--accent)">'+(e.type||'')+'</div>'
        +'<div style="font-size:calc(10px * var(--ui-zoom));color:var(--muted)">👤 '+(e.persons||'')+'</div>'
        +'<div style="font-size:calc(11px * var(--ui-zoom));line-height:1.6;margin-top:3px">'+(e.desc||'')+'</div>'
        +commentaryHTML(e)
        +xrefHTML
        +'<div style="font-size:calc(10px * var(--ui-zoom));color:var(--accent);margin-top:3px">📖 '+(e.ref||'')+'</div>'
        +bibleLinksHTML(e.ref)
        +'</div>';
    }).join('');
    return '<div class="popup-wrap">'
      +'<div style="display:flex;gap:5px;margin-bottom:7px">'
      +'<span style="padding:2px 7px;border-radius:3px;font-size:calc(9px * var(--ui-zoom));background:'+mcol+'22;color:'+mcol+'">'+mlbl+'</span>'
      +'<span style="padding:2px 7px;border-radius:3px;font-size:calc(9px * var(--ui-zoom));background:'+col+'22;color:'+col+'">'+rlbl+'</span>'
      +'</div>'
      +'<div class="popup-name">'+p.name+'</div>'
      +(p.nameEn ? '<div class="popup-name-en">'+p.nameEn+'</div>' : '')
      +'<div style="font-size:calc(11px * var(--ui-zoom));color:#a0b4c8;margin-bottom:4px;line-height:1.6;'
      +'padding:5px 8px;background:rgba(255,255,255,0.05);border-radius:5px 5px 0 0;'
      +'border-left:2px solid #3a5a7a">📍 '+geoLoc+'</div>'
      +(p.virtual ? '<div style="font-size:calc(10px * var(--ui-zoom));color:#c8a84a;margin:4px 0 8px;line-height:1.6;padding:5px 8px;background:rgba(200,168,74,0.1);border:1px dashed rgba(200,168,74,0.4);border-radius:5px">◆ 이 위치는 실제 역사적 지명이 아니라, 서신서 등에서 다뤄지는 신학적 주제를 표시하기 위해 관련 지역 인근에 둔 상징적 지점입니다.</div>' : '')
      +elevHtml
      +'<div style="margin-bottom:10px"></div>'
      +'<div class="popup-sec-title">연대 · 인물 · 사건</div>'
      +evHTML
      +'<button class="no-print" onclick="printPopupContent(this)" style="width:100%;margin-top:10px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,0.06);color:var(--muted);cursor:pointer;font-family:inherit;font-size:calc(10px * var(--ui-zoom));font-weight:600">🖨 인쇄 / PDF로 저장</button>'
      +'</div>';
  }
  return buildPopup(p);
}
function renderAll() {
  renderLegend(); renderList(); renderMarkers();
  if (isJourneyMode()) renderRoutes();
  else { routeLines.forEach(l=>map.removeLayer(l)); routeLines=[]; }
}

function fitVisibleMarkers(maxZoom){
  var src = isJourneyMode() ? JOURNEY_PLACES : PLACES;
  var cs = src.filter(isVisible).map(function(p){return [p.lat,p.lng];});
  if (cs.length) map.fitBounds(L.latLngBounds(cs), {padding:[60,60], maxZoom:(maxZoom||11), animate:true});
}
// '🌐 전체 (구약+신약)' 버튼: 시대 필터와 인물여정 모드를 모두 초기화하고 전체 보기로 복귀
function viewAll() {
  xrefViewMode = false;
  currentFilter = 'all';
  searchQuery = '';
  const sb = document.getElementById('searchBox');
  if (sb) sb.value = '';
  if (isJourneyMode()) {
    switchMap('all', null);
  } else {
    if (selectedId) { const sel = PLACES.find(q => q.id === selectedId); if (sel && !isVisible(sel)) { selectedId = null; map.closePopup(); } }
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.region === 'all'));
    renderAll();
  }
}
// '🔗 구약·신약 연결 보기' — EVENT_XREFS를 모아 별도 목록으로 보여줌
function viewXrefs() {
  xrefViewMode = true;
  currentFilter = 'all';
  searchQuery = '';
  const sb = document.getElementById('searchBox');
  if (sb) sb.value = '';
  if (isJourneyMode()) { switchMap('all', null); }
  else { renderAll(); }
}
function filterRegion(region, btn) {
  currentFilter=region;
  if(selectedId){const sel=PLACES.find(q=>q.id===selectedId);if(sel&&!isVisible(sel)){selectedId=null;map.closePopup();}}
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.region===region));
  renderAll();
  if (region !== 'all') fitVisibleMarkers(11);
}

function filterTestament(t) {
  currentFilter = t;
  if(selectedId){const sel=PLACES.find(q=>q.id===selectedId);if(sel&&!isVisible(sel)){selectedId=null;map.closePopup();}}
  renderAll();
}

function onSearch(q) {
  searchQuery=q.trim();
  if(selectedId){const src=isJourneyMode()?JOURNEY_PLACES:getMainSearchPool();const sel=src.find(r=>r.id===selectedId);if(sel&&!isVisible(sel)){selectedId=null;map.closePopup();}}
  renderAll();
}
document.getElementById('searchBox').addEventListener('input',e=>onSearch(e.target.value));

function selectPlace(id) {
  const place = PLACES.find(p => p.id === id);
  if (place) {
    // 대상 지명이 현재 필터·검색·인물여정 모드로 인해 지도에 렌더링되어 있지 않다면
    // 전체 보기로 전환해 반드시 찾을 수 있도록 한다 (구약·신약 교차 연결이 항상 동작하게 함)
    if (!markers[id]) {
      _switching = true; // 마커 재구성 중 popupclose로 인한 renderAll() 재진입 방지
      map.closePopup();
      currentFilter = 'all';
      searchQuery = '';
      const sb = document.getElementById('searchBox'); if (sb) sb.value = '';
      if (isJourneyMode()) currentMap = 'all';
      document.querySelectorAll('.map-tab, .sb-tab').forEach(b => b.classList.toggle('active', b.dataset.map === 'all'));
      renderAll();
      _switching = false;
    }
    _switching = true;
    selectedId = id;
    renderAll();
    _switching = false;
    const marker = markers[id];
    if (!marker) return;
    map.flyTo([marker.getLatLng().lat, marker.getLatLng().lng], Math.max(map.getZoom(), 8), {animate: true, duration: 0.8});
    setTimeout(() => marker.openPopup(), 850);
    setTimeout(() => { const el = document.querySelector('.place-item.selected'); if (el) el.scrollIntoView({behavior: 'smooth', block: 'nearest'}); }, 100);
    return;
  }
  // PLACES에 없다면 인물여정 전용 데이터(JOURNEY_PLACES)에서 찾아, 해당 인물의 여정 모드로 전환한다.
  const jplace = JOURNEY_PLACES.find(p => p.id === id);
  if (!jplace) return;
  _switching = true;
  switchMap(jplace.map, null);
  selectedId = id;
  renderAll();
  _switching = false;
  setTimeout(() => {
    const marker = markers[id];
    if (!marker) return;
    map.flyTo([marker.getLatLng().lat, marker.getLatLng().lng], Math.max(map.getZoom(), 8), {animate: true, duration: 0.8});
    setTimeout(() => marker.openPopup(), 850);
  }, 60);
}

function setTile(name) {
  map.removeLayer(TILES[currentTile]); map.addLayer(TILES[name]); currentTile=name;
  document.body.classList.toggle('tile-dark', name==='dark');
  document.querySelectorAll('.tile-btn[data-tile]').forEach(b=>b.classList.toggle('active',b.dataset.tile===name));
}


// ⑥ switchMap / renderRoutes / toggleRoutes
function switchMap(m, btn) {
  // 팝업 닫기
  map.closePopup();

  // 지도 위 모든 마커·경로선 강제 제거
  Object.values(markers).forEach(mk => map.removeLayer(mk));
  markers = {};
  routeLines.forEach(l => map.removeLayer(l));
  routeLines = [];
  // 위에서 못 잡힌 레이어까지 전체 순회 제거
  map.eachLayer(layer => {
    if (layer instanceof L.Marker || layer instanceof L.Polyline) {
      map.removeLayer(layer);
    }
  });

  currentMap = m;
  selectedId = null;
  currentJourneyFilter = 'all';

  // 탭 활성화 (헤더 + 사이드바)
  document.querySelectorAll('.map-tab, .sb-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.map === m);
    if (b.dataset.map === m) {
      const col = m === 'all' ? '#ccc' : MAP_COLORS[m];
      b.style.background = m === 'all' ? 'rgba(255,255,255,0.1)' : col + '22';
      b.style.color = col;
    } else {
      b.style.background = 'transparent';
      b.style.color = '';
    }
  });

(function(){
  try {
    var byMap = {};
    JOURNEY_PLACES.forEach(function(p){
      if (p.map == null || p.seq == null) return;
      (byMap[p.map] = byMap[p.map] || []).push(p);
    });
    Object.keys(byMap).forEach(function(mp){
      var ms = byMap[mp].slice().sort(function(a,b){ return a.seq - b.seq; });
      var regions = [];
      ms.forEach(function(m){ if (regions.indexOf(m.region) < 0) regions.push(m.region); });
      regions.forEach(function(R){
        if (!(R in ROUTES)) return;
        var idxs = [];
        ms.forEach(function(m,i){ if (m.region === R) idxs.push(i); });
        if (!idxs.length) return;
        var coords = [];
        if (idxs[0] > 0) coords.push([ms[idxs[0]-1].lat, ms[idxs[0]-1].lng]);
        idxs.forEach(function(i){ coords.push([ms[i].lat, ms[i].lng]); });
        coords = coords.filter(function(c,i){ return i===0 || c[0]!==coords[i-1][0] || c[1]!==coords[i-1][1]; });
        if (coords.length >= 2) ROUTES[R] = coords;
      });
    });
  } catch(e) { console.warn('route rebuild skipped:', e); }
})();

    var hdr=document.querySelector('header');
    if(hdr){
      var h=hdr.getBoundingClientRect().height;
      document.documentElement.style.setProperty('--header-h', h+'px');
    }
  }
  setHeaderH();
  window.addEventListener('resize', setHeaderH);
  window.addEventListener('load', setHeaderH);
  if(document.readyState!=='complete'){
    document.addEventListener('DOMContentLoaded', setHeaderH);
  }
  // 폰트·렌더 지연 대응 재측정
  [100,300,600,1200].forEach(function(t){ setTimeout(setHeaderH, t); });
  // 헤더 크기 변화 실시간 감지
  if(window.ResizeObserver){
    var hdr=document.querySelector('header');
    if(hdr){ new ResizeObserver(setHeaderH).observe(hdr); }
  }
})();
</script>
<script>
// 글자 크기(확대/축소) 컨트롤 — 지도 팝업(지명 설명) 글자·크기 확대
(function(){
  var LEVELS=[1,1.15,1.3,1.5,1.75,2];
  var MIN_Z=1, MAX_Z=2.4;
  var idx=0, curZ=1;
  try{
    var saved=parseFloat(localStorage.getItem('bibleMapTextZoom'));
    if(!isNaN(saved)){
      var found=LEVELS.indexOf(saved);
      idx = found>=0 ? found : 0;
    }
  }catch(e){}

  function setRaw(z, persist){
    z = Math.max(MIN_Z, Math.min(MAX_Z, z));
    curZ = z;
    document.documentElement.style.setProperty('--ui-zoom', z);
    var lbl=document.getElementById('textZoomLabel');
    if(lbl) lbl.textContent = Math.round(z*100)+'%';
    if(persist){
      try{ localStorage.setItem('bibleMapTextZoom', String(z)); }catch(e){}
    }
  }

  function apply(){
    setRaw(LEVELS[idx], true);
  }

  window.setTextZoom=function(dir){
    if(dir===0){ idx=0; }
    else{ idx=Math.min(LEVELS.length-1, Math.max(0, idx+dir)); }
    apply();
  };

  // 다른 스크립트(핀치 줌)에서 쓸 수 있게 노출
  window.__uiZoom = {
    setRaw: function(z){ setRaw(z, false); },
    commit: function(){
      // 현재 값을 LEVELS 중 가장 가까운 값으로 스냅하지 않고, 그대로 저장(자연스러운 핀치 결과 유지)
      try{ localStorage.setItem('bibleMapTextZoom', String(curZ)); }catch(e){}
      // 버튼(+/-) 스텝 기준점도 현재 값에 맞춰 갱신
      var nearest=0, diff=Infinity;
      LEVELS.forEach(function(v,i){ var d=Math.abs(v-curZ); if(d<diff){diff=d; nearest=i;} });
      idx = nearest;
    },
    get: function(){ return curZ; }
  };

  apply();
})();
</script>
<script>
// 팝업 두 손가락 핀치 제스처 — 지도가 제스처를 가로채므로, 팝업 위에서는 직접 거리 변화를 계산해
// 같은 --ui-zoom 값을 조절한다(버튼과 동일한 배율을 공유).
(function(){
  function dist(t0, t1){
    var dx=t0.clientX-t1.clientX, dy=t0.clientY-t1.clientY;
    return Math.sqrt(dx*dx+dy*dy);
  }
  var startDist=null, startZoom=1;

  function onTouchStart(ev){
    if(ev.touches.length===2){
      startDist = dist(ev.touches[0], ev.touches[1]);
      startZoom = (window.__uiZoom && window.__uiZoom.get()) || 1;
      ev.preventDefault();
    }
  }
  function onTouchMove(ev){
    if(ev.touches.length===2 && startDist){
      var d = dist(ev.touches[0], ev.touches[1]);
      var ratio = d / startDist;
      var z = startZoom * ratio;
      if(window.__uiZoom) window.__uiZoom.setRaw(z);
      ev.preventDefault();
      ev.stopPropagation();
    }
  }
  function onTouchEnd(ev){
    if(ev.touches.length<2){
      startDist=null;
      if(window.__uiZoom) window.__uiZoom.commit();
    }
  }

  map.on('popupopen', function(e){
    var el = e.popup.getElement();
    if(!el) return;
    el.addEventListener('touchstart', onTouchStart, {passive:false});
    el.addEventListener('touchmove', onTouchMove, {passive:false});
    el.addEventListener('touchend', onTouchEnd, {passive:true});
    el.addEventListener('touchcancel', onTouchEnd, {passive:true});
  });
})();
</script>
<script>
// 데스크탑 마우스 휠 확대 — 팝업 위에서 Ctrl(맥은 Cmd/트랙패드 핀치)을 누른 채 휠을 돌리면
// 브라우저 페이지 확대나 지도 확대 대신 팝업 배율(--ui-zoom)이 조절된다.
// Ctrl 없이 휠만 돌리면 평소처럼 팝업 내용을 스크롤한다.
(function(){
  var wheelTimer=null;

  function onWheel(ev){
    if(!(ev.ctrlKey || ev.metaKey)) return; // Ctrl(윈도우)/Cmd(맥) 없으면 일반 스크롤 유지
    ev.preventDefault();
    ev.stopPropagation();
    if(!window.__uiZoom) return;
    var cur = window.__uiZoom.get();
    var delta = -ev.deltaY * 0.0015; // 위로 굴리면 확대, 아래로 굴리면 축소
    window.__uiZoom.setRaw(cur * (1 + delta));
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(function(){ window.__uiZoom.commit(); }, 250);
  }

  map.on('popupopen', function(e){
    var el = e.popup.getElement();
    if(!el) return;
    el.addEventListener('wheel', onWheel, {passive:false});
  });
})();
</script>
